{% extends 'base.html' %}

{% block title %}Upload - Food Management{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Upload Document</h1>
    
    <div class="bg-white p-8 rounded-lg shadow-md">
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="file" class="block text-sm font-medium text-gray-700 mb-2">Select File</label>
                <input type="file" id="file" name="file" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" required>
                <p class="text-sm text-gray-500 mt-2">Supported formats: Images, PDFs</p>
            </div>
            
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <textarea id="description" name="description" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="Optional description..."></textarea>
            </div>
            
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
                Upload
            </button>
        </form>
        
        <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
            <p class="text-sm text-blue-800">
                <strong>AI Processing:</strong> Uploaded documents will be processed using AI to extract relevant information.
            </p>
        </div>
    </div>
</div>
{% endblock %}
